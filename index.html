<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Jolla Coast Walk Trail | 大佬推介</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --surface-color: #121212;
            --accent-color: #3b82f6;
            --text-color: #e5e7eb;
            --muted-text: #9ca3af;
            --border-color: #262626;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        header {
            text-align: center;
            margin-bottom: 3rem;
            border: 2px solid var(--accent-color);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        h1 { margin-top: 0; color: #fff; }
        .banner {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 2rem;
            display: block;
        }
        .section {
            background: var(--surface-color);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>La Jolla Coast Walk Trail</h1>
            <p>大佬與朋友嘅 La Jolla 絕美海景漫步之旅</p>
        </header>
        
        <img src="banner.jpg" alt="La Jolla Coast Walk Trail" class="banner">

        <div class="section">
            <h2>步道介紹</h2>
            <p>La Jolla Coast Walk Trail 係 San Diego 最具代表性嘅步道，沿住 breathtaking 嘅懸崖海岸線，可以俯瞰太平洋壯麗景色，仲有機會睇到海獅同埋自然海蝕洞。呢度係一班朋友休閒 hea 行、影相打卡嘅絕佳地方。</p>
        </div>

        <div class="section">
            <h2>行程資訊</h2>
            <p><strong>路線長度：</strong> 來回約 0.5 - 1 mile，輕鬆易行。</p>
            <p><strong>停車建議：</strong> 建議在 Coast Blvd 尋找路邊停車位（週末熱門，宜早到）。</p>
            <p><strong>起點連結：</strong> <a href="https://www.google.com/maps/search/?api=1&query=La+Jolla+Coast+Walk+Trail" target="_blank" style="color:var(--accent-color)">點擊打開 Google Maps</a></p>
        </div>
    </div>
</body>
</html>
